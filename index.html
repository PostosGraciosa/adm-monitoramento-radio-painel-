<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoramento de Rádio | Postos Graciosa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .cabecalho { text-align: center; padding: 20px 0 10px; }
    .empresa {
      display: inline-block;
      background: #f59e0b;
      color: #0f172a;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
    .cabecalho h1 { font-size: 1.9rem; color: #ffffff; }
    .descricao { color: #94a3b8; margin-top: 6px; font-size: 0.95rem; }
    .relogio { margin-top: 12px; font-size: 1.6rem; font-weight: 700; color: #38bdf8; }
    .relogio #date { font-size: 1rem; color: #94a3b8; margin-left: 10px; }

    .resumo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin: 24px 0;
    }
    .resumo-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      border: 1px solid #334155;
    }
    .resumo-card span { display: block; font-size: 2rem; font-weight: 800; color: #ffffff; }
    .resumo-card label { font-size: 0.7rem; letter-spacing: 1px; color: #94a3b8; }

    .barra-controle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 16px;
    }
    #lastUpdate { font-size: 0.85rem; color: #94a3b8; }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
    }
    .card-header .icone { font-size: 1.5rem; }
    .card-header .nome { font-weight: 700; color: #fff; font-size: 0.95rem; }
    .card-header .codigo { color: #64748b; font-size: 0.75rem; }
    .status-badge {
      margin-left: auto;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .status-online { background: #052e16; color: #4ade80; }
    .status-pausado { background: #451a03; color: #fbbf24; }
    .status-offline { background: #450a0a; color: #f87171; }
    .status-verificando { background: #0c4a6e; color: #38bdf8; }

    .card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card-body .linha { font-size: 0.82rem; color: #cbd5e1; }
    .card-body .linha strong { color: #94a3b8; font-weight: 600; }
    .card-body .evento {
      background: #0f172a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.8rem;
      color: #e2e8f0;
      min-height: 36px;
    }

    .card-footer {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #334155;
    }
    .card-footer .btn { flex: 1; font-size: 0.8rem; padding: 8px; }
    .btn-verde { background: #16a34a; }
    .btn-verde:hover { background: #15803d; }
    .btn-cinza { background: #475569; }
    .btn-cinza:hover { background: #334155; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal[hidden] { display: none; }
    .modal-content {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      max-width: 520px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
    }
    .modal-header h2 { font-size: 1rem; color: #fff; }
    .modal-header button {
      background: #334155;
      border: none;
      color: #e2e8f0;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
    }
    #historyList {
      list-style: none;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #historyList li {
      background: #0f172a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.8rem;
    }
    #historyList .h-status { font-weight: 700; }

    .rodape { text-align: center; color: #64748b; font-size: 0.8rem; padding: 10px 0; }
  </style>
</head>
